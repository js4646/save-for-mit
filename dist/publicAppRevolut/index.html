<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.mit.js"></script>
    <title>Revolut MIT Example</title>
  </head>
  <body>
    <b> Create order: </b><br />
    <label for="order-price">Order price (GBP):</label><br />
    <input
      type="number"
      step="0.01"
      placeholder="0.00"
      id="order-price"
      name="order-price"
    /><br />
    <button id="button-create-order" type="button">Create New Order</button>
    <div id="order-info"></div>
    <br />
    <div id="ask-card-details"><b>Please fill in your card details:</b></div>
    <div id="cart-field"></div>
    <div id="payment-status"></div>
    <!-- Divider -->
    <hr />
  </body>
</html>
